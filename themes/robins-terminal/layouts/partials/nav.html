<nav class="site-nav">
  <a class="nav-logo" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>

  <ul class="nav-links">
    {{ range .Site.Menus.main }}
    <li>
      <a href="{{ .URL | relURL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>
        {{ if .Name }}
          {{ replace .Name "_" " " }}
        {{ else if .Identifier }}
          {{ replace .Identifier "_" " " }}
        {{ else }}
          Link
        {{ end }}
      </a>
    </li>
    {{ end }}
    {{ range .Site.Menus.icons }}
    <li><a href="{{ .URL }}" target="_blank" rel="noopener noreferrer">{{ .Name }}</a></li>
    {{ end }}
  </ul>

</nav>
